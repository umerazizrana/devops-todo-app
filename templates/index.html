<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevOps Task Manager</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #eef2f7;
      color: #172033;
      margin: 0;
      padding: 40px 20px;
    }
    main {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 28px;
      border-radius: 16px;
    }
    h1 { margin-bottom: 8px; }
    .subtitle { color: #526078; }
    form, li {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #b6c2d2;
      border-radius: 8px;
      font: inherit;
    }
    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      background: #e7edf5;
      color: #172033;
    }
    form button { background: #2458d3; color: white; }
    button:disabled { opacity: .6; cursor: wait; }
    ul { padding: 0; list-style: none; }
    li {
      padding: 16px 0;
      border-bottom: 1px solid #e7edf5;
      flex-wrap: wrap;
    }
    .title { flex: 1; overflow-wrap: anywhere; }
    .done { text-decoration: line-through; color: #667085; }
    #message { min-height: 24px; color: #a12222; }
  </style>
</head>
<body>
<main>
  <h1>DevOps Task Manager</h1>
  <p class="subtitle">Flask application with PostgreSQL storage</p>

  <form id="task-form">
    <input id="title" aria-label="Task title"
           placeholder="What do you need to do?"
           maxlength="200" required>
    <button type="submit">Add task</button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>
  <ul id="tasks"></ul>
</main>

<script>
  const list = document.getElementById("tasks");
  const message = document.getElementById("message");
  const form = document.getElementById("task-form");
  const input = document.getElementById("title");

  async function api(path, options = {}) {
    const response = await fetch(path, options);
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      throw new Error(data.error || "Request failed. Please try again.");
    }
    return response.status === 204 ? null : response.json();
  }

  async function changeTask(button, path, method) {
    button.disabled = true;
    message.textContent = "";
    try {
      await api(path, {method});
      await loadTasks();
    } catch (error) {
      message.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  }

  async function loadTasks() {
    const tasks = await api("/api/tasks");
    list.replaceChildren();

    if (tasks.length === 0) {
      const empty = document.createElement("li");
      empty.textContent = "No tasks yet. Add your first task above.";
      list.append(empty);
    }

    for (const task of tasks) {
      const row = document.createElement("li");
      const title = document.createElement("span");
      title.className = task.completed ? "title done" : "title";
      title.textContent = task.title;

      const toggle = document.createElement("button");
      toggle.textContent = task.completed ? "Undo" : "Complete";
      toggle.onclick = () => changeTask(
        toggle, `/api/tasks/${task.id}/toggle`, "POST"
      );

      const remove = document.createElement("button");
      remove.textContent = "Delete";
      remove.onclick = () => changeTask(
        remove, `/api/tasks/${task.id}`, "DELETE"
      );

      row.append(title, toggle, remove);
      list.append(row);
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const title = input.value.trim();
    if (!title) {
      message.textContent = "Please enter a task.";
      return;
    }

    const button = form.querySelector("button");
    button.disabled = true;
    message.textContent = "";

    try {
      await api("/api/tasks", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({title})
      });
      input.value = "";
      await loadTasks();
    } catch (error) {
      message.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  });

  loadTasks().catch(error => {
    message.textContent = error.message;
  });
</script>
</body>
</html>
